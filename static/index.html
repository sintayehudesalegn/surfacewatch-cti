<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SurfaceWatch CTI</title>
<style>
:root{color-scheme:dark;--bg:#0b1016;--pn:#131a23;--p2:#1a2330;--bd:#263344;--tx:#dbe5f0;--mu:#8a9bb0;--ac:#38bdf8;--cr:#ef4444;--hi:#f97316;--me:#eab308;--lo:#3b82f6;--in:#64748b;--ok:#22c55e}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#eef2f6;--pn:#fff;--p2:#f3f6fa;--bd:#d5dde8;--tx:#16202c;--mu:#5a6b7e;--ac:#0369a1}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;grid-template-columns:220px minmax(0,1fr);background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
aside{position:sticky;top:0;height:100vh;background:var(--pn);border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
aside h1{font-size:16px;margin:0 8px 14px;letter-spacing:.3px}aside h1 span{color:var(--ac)}
aside a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;color:var(--mu);text-decoration:none}aside a:hover{background:var(--p2);color:var(--tx)}aside a.on{background:var(--ac);color:#04121c;font-weight:600}
.env{margin-top:auto;font-size:12px;color:var(--mu);padding:8px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
main{min-width:0;height:100vh;overflow:auto;padding:22px 28px}h2{margin:0 0 16px;font-size:20px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}.card h3{margin:0 0 10px;font-size:14px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.stat{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:14px 16px}.stat .n{font-size:28px;font-weight:700}.stat .l{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.two{display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr);gap:16px;align-items:start}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0}.bar i{display:block;height:10px;border-radius:5px;min-width:4px}.bar b{width:90px;font-weight:500}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit;max-width:100%}input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
input[type=checkbox]{width:auto;accent-color:var(--ac)}input.w{width:100%}
.btn{background:var(--ac);color:#04121c;border:0;border-radius:8px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}.btn.g{background:var(--p2);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--cr);color:#fff}.btn:disabled{opacity:.5}
label.f{display:block;margin:10px 0 4px;color:var(--mu);font-size:12px}label.c{display:flex;gap:8px;margin:8px 0;align-items:flex-start}
.tbl{overflow:auto;max-height:calc(100vh - 330px);border:1px solid var(--bd);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:640px}
th{position:sticky;top:0;background:var(--p2);text-align:left;padding:9px 12px;color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase;cursor:pointer;white-space:nowrap;user-select:none;z-index:1}th:hover{color:var(--tx)}
td{padding:9px 12px;border-top:1px solid var(--bd);vertical-align:top}tbody tr{cursor:pointer}tbody tr:hover{background:var(--p2)}.mu{color:var(--mu)}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.s{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}.Critical{background:var(--cr)}.High{background:var(--hi)}.Medium{background:var(--me);color:#111}.Low{background:var(--lo)}.Informational,.skipped,.pending,.queued{background:var(--in)}.ok,.completed{background:var(--ok)}.failed,.cancelled{background:var(--cr)}.partial,.warning,.completed_with_errors{background:var(--me);color:#111}.running{background:var(--ac);color:#04121c}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow:auto}.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);padding:9px 14px;font:inherit;cursor:pointer;white-space:nowrap}.tabs button.on{color:var(--tx);border-color:var(--ac)}.tabs em{font-style:normal;background:var(--p2);border-radius:10px;padding:0 7px;margin-left:6px;font-size:12px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.hd{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:6px 0;max-height:300px;overflow:auto;font-size:12.5px}
#ov{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:.2s;z-index:20}#ov.on{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;right:0;height:100vh;width:min(620px,100vw);background:var(--pn);border-left:1px solid var(--bd);transform:translateX(100%);transition:transform .2s;z-index:21;display:flex;flex-direction:column}#dr.on{transform:none}
#dr header{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:10px;align-items:start}#dr .bd{padding:16px 18px;overflow:auto}#dr h4{margin:16px 0 4px;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px}#dr p{margin:4px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--p2);border:1px solid var(--bd);padding:10px 18px;border-radius:8px;z-index:30;display:none}
.err{color:var(--cr)}.empty{padding:36px;text-align:center;color:var(--mu)}a{color:var(--ac)}
@media(max-width:860px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{position:static;height:auto;flex-direction:row;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--bd)}aside h1,.env{display:none}main{height:auto;padding:14px}.two{grid-template-columns:1fr}.tbl{max-height:none}}
</style></head><body>
<aside><h1>Surface<span>Watch</span> CTI</h1><a href="#dash" data-p="dash">▦ Dashboard</a><a href="#scan" data-p="scan">⌕ Scan Manager</a><a href="#res" data-p="res">☰ Results</a><div class="env" id="env"></div></aside>
<main id="m"></main><div id="ov" onclick="closeDr()"></div><div id="dr"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=async(u,o)=>{const r=await fetch("/api/v1"+u,{cache:"no-store",...(o?{...o,headers:{"Content-Type":"application/json"},body:o.body&&JSON.stringify(o.body)}:{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail?.error||(typeof j.detail=="string"?j.detail:"")||j.error||r.statusText);return j};
const toast=(m,e)=>{const t=$("#toast");t.textContent=m;t.style.color=e?"var(--cr)":"var(--tx)";t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",3500)};
const B=(t,c)=>`<span class="s ${esc(c||t)}">${esc(t)}</span>`,cvc=s=>s==null?"Informational":s>=9?"Critical":s>=7?"High":s>=4?"Medium":"Low";
const STAT=["Detected","Triaged","Requires validation","Validated","False positive","Accepted risk","Remediation in progress","Fixed","Revalidated"];
let H={},S={tab:"svc",q:"",sev:"",kev:false,sort:{},scan:null,id:null},TM,POLL=0,ROWS=[],ST={},LOADED=0;
addEventListener("hashchange",route);addEventListener("keydown",e=>e.key=="Escape"&&closeDr());
async function route(){const[p,a]=(location.hash.slice(1)||"dash").split("/");POLL++;clearTimeout(TM);closeDr();document.querySelectorAll("aside a").forEach(x=>x.classList.toggle("on",x.dataset.p==p));
try{H=await api("/health");$("#env").innerHTML=`<div><span class="dot" style="background:${H.nmap?"var(--ok)":"var(--cr)"}"></span>nmap ${H.nmap?"found":"missing"}</div><div><span class="dot" style="background:${H.root?"var(--ok)":"var(--me)"}"></span>${H.root?"root":"non-root"}</div><div><span class="dot" style="background:${H.nvd_api_key?"var(--ok)":"var(--me)"}"></span>NVD key ${H.nvd_api_key?"set":"not set"}</div>`;
await({dash,scan,res}[p]||dash)(a)}catch(e){$("#m").innerHTML=`<div class="card err">${esc(e.message)}</div>`}}
const hist=sc=>sc.length?`<div class="tbl"><table><thead><tr><th>ID</th><th>Target</th><th>Profile</th><th>Status</th><th>Created</th></tr></thead><tbody>${sc.map(s=>`<tr onclick="location.hash='#res/${esc(s.id)}'"><td class="mono">${esc(s.id)}</td><td>${esc(s.target)}</td><td>${esc(s.profile)}</td><td>${B(s.status)}</td><td class="mu">${esc(s.created.replace("T"," ").slice(0,19))}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No scans yet.</div>`;
async function dash(){const[d,sc]=await Promise.all([api("/dashboard"),api("/scans")]);const k=[["Scan jobs",d.scans],["Hosts",d.hosts],["Open TCP",d.open_tcp],["Open UDP",d.open_udp],["Services",d.services],["Versions",d.versions],["CVE candidates",d.cve_candidates],["Validated",d.validated],["KEV matches",d.kev],["Enrichment failures",d.enrichment_failures]];
const ord=["Critical","High","Medium","Low","Informational"],mx=Math.max(1,...Object.values(d.findings_by_severity));
$("#m").innerHTML=`<h2>Dashboard</h2>${H.nmap?"":`<div class="card err">Nmap not found. Install: sudo apt install -y nmap</div>`}<div class="stats">${k.map(x=>`<div class="stat"><div class="l">${x[0]}</div><div class="n">${x[1]}</div></div>`).join("")}</div>
<div class="two"><div class="card"><h3>Findings by severity</h3>${ord.map(s=>`<div class="bar"><b>${s}</b><i class="${s}" style="width:${(d.findings_by_severity[s]||0)/mx*60}%"></i><span>${d.findings_by_severity[s]||0}</span></div>`).join("")}</div><div class="card"><h3>Recent assessments</h3>${hist(sc.slice(0,8))}</div></div>`}
async function scan(){const[sc,ss]=await Promise.all([api("/scans"),api("/scopes")]);
$("#m").innerHTML=`<h2>Scan Manager</h2><div class="two"><div class="card"><h3>New scan</h3>${ss.length?`<div class="mu">Previously authorized: ${ss.slice(-8).reverse().map(s=>`<a href="#" onclick="$('#t').value='${esc(s.value)}';return false">${esc(s.value)}</a>`).join(" · ")}</div>`:""}
<label class="f">Asset (IP, hostname or CIDR)</label><input class="w" id="t" placeholder="host.example.org or 203.0.113.0/28" autofocus><label class="f">Profile</label><select class="w" id="pr">${Object.entries(H.profiles).map(([k,v])=>`<option value="${k}" ${k=="standard"?"selected":""}>${esc(k)}</option>`).join("")}</select><div class="mu" id="pd" style="margin-top:4px"></div>
<div class="tb" style="margin-top:10px"><div><label class="f">Timing</label><select id="tm"><option>2</option><option selected>3</option><option>4</option></select></div><div><label class="f">Max rate</label><input id="mr" type="number" value="0" min="0" max="2000" style="width:90px"></div><div><label class="f">Host timeout (s)</label><input id="ht" type="number" value="1800" min="60" max="7200" style="width:100px"></div></div>
<label class="c"><input type="checkbox" id="pn"><span>Skip host discovery (-Pn). Probes hosts that ignore ping; more traffic.</span></label><label class="c"><input type="checkbox" id="os" ${H.root?"":"disabled"}><span>OS fingerprinting ${H.root?"":"(needs root)"}</span></label>
<label class="c"><input type="checkbox" id="en" checked><span>CVE / KEV / EPSS enrichment (sends product and version strings to NVD, CISA, FIRST)</span></label><label class="c"><input type="checkbox" id="ax"><span>I own this asset or have written authorization to test it</span></label>
<button class="btn" id="go">Start scan</button> <span id="msg" class="err"></span><p class="mu">Fixed templates only. Allowed scripts: ${Object.keys(H.script_allowlist).join(", ")}.</p></div><div class="card"><h3>Scan history</h3>${hist(sc)}</div></div>`;
const pd=()=>$("#pd").textContent=H.profiles[$("#pr").value];$("#pr").onchange=pd;pd();
$("#go").onclick=async()=>{$("#go").disabled=true;try{const r=await api("/scans",{method:"POST",body:{target:$("#t").value,profile:$("#pr").value,timing:+$("#tm").value,max_rate:+$("#mr").value,host_timeout:+$("#ht").value,skip_discovery:$("#pn").checked,os_detect:$("#os").checked,enrich:$("#en").checked,authorized:$("#ax").checked}});location.hash="#res/"+r.id}catch(e){$("#msg").textContent=e.message;$("#go").disabled=false}}}
async function res(id){if(!id){$("#m").innerHTML=`<h2>Results</h2><div class="card">${hist(await api("/scans"))}</div>`;return}
const tok=POLL;S.id=id;S.scan=null;LOADED=0;ST={};(await api("/state")).forEach(x=>ST[x.key]=x);if(tok!=POLL)return;$("#m").innerHTML=`<div id="hd"></div><div class="tabs" id="tabs"></div><div id="tb"></div><div id="tbl"></div>`;
const tick=async()=>{if(tok!=POLL||!$("#hd"))return;try{await load()}catch(e){}if(tok==POLL&&S.scan&&["queued","running"].includes(S.scan.status))TM=setTimeout(tick,2000)};tick()}
async function load(){const s=await api("/scans/"+S.id);if(!$("#hd")||s.id!=S.id)return;S.scan=s;const r=s.result||{},run=["queued","running"].includes(s.status);
$("#hd").innerHTML=`<div class="card"><div class="hd"><div><h2 style="margin:0">${esc(s.target)} ${B(s.status)}</h2><span class="mu mono">${esc(s.id)} · ${esc(s.profile)} · ${esc((r.ips||[]).join(", "))}</span></div><div class="tb" style="margin:0">${run?`<button class="btn d" onclick="api('/scans/${s.id}/cancel',{method:'POST'}).then(()=>toast('Cancelling'))">Cancel</button>`:""}${["txt","html","json","pdf"].map(f=>`<a class="btn g" style="text-decoration:none" href="/api/v1/scans/${s.id}/report?fmt=${f}" target="_blank">${f.toUpperCase()}</a>`).join("")}<a class="btn g" style="text-decoration:none" href="/api/v1/scans/${s.id}/raw" target="_blank">XML</a></div></div>
<div class="steps">${Object.entries(s.stages).map(([a,b])=>`<span>${esc(a)} ${B(b)}</span>`).join("")}</div>${s.error?`<div class="err">${esc(s.error)}</div>`:""}${(r.warnings||[]).map(w=>`<div class="mu">⚠ ${esc(w)}</div>`).join("")}</div>`;
const n={svc:(r.hosts||[]).reduce((a,h)=>a+h.ports.length,0),fnd:(r.findings||[]).length,cve:(r.cves||[]).length,enr:(r.enrichment?.services||[]).length};
$("#tabs").innerHTML=[["svc","Services"],["fnd","Findings"],["cve","CVE candidates"],["enr","Enrichment"]].map(([k,l])=>`<button class="${S.tab==k?"on":""}" onclick="S.tab='${k}';S.q='';S.sev='';S.kev=false;tabs()">${l}<em>${n[k]}</em></button>`).join("");
if(!LOADED||LOADED!=S.id){LOADED=S.id;toolbar()}draw()}
function tabs(){toolbar();draw();load()}
function toolbar(){const t=S.tab;$("#tb").innerHTML=t=="enr"?"":`<div class="tb"><input id="q" placeholder="Filter…" value="${esc(S.q)}" style="min-width:240px;flex:1" oninput="S.q=this.value;draw()">${t=="fnd"||t=="cve"?`<select onchange="S.sev=this.value;draw()"><option value="">All severities</option>${["Critical","High","Medium","Low","Informational"].map(x=>`<option ${S.sev==x?"selected":""}>${x}</option>`).join("")}</select>`:""}${t=="cve"?`<label class="c" style="margin:0"><input type="checkbox" ${S.kev?"checked":""} onchange="S.kev=this.checked;draw()">KEV only</label>`:""}<span class="mu" id="cnt"></span></div>`}
const COLS={
svc:[["Host",r=>r.h,r=>`${esc(r.h)} <span class="mu">${esc(r.hn)}</span>`],["Port",r=>r.p.port,r=>`<span class="mono">${r.p.port}/${r.p.proto}</span>`],["State",r=>r.p.state,r=>esc(r.p.state)+(r.p.state=="open|filtered"?' <span class="mu">(inconclusive)</span>':"")],["Service",r=>r.p.service,r=>esc(r.p.service)],["Product / version",r=>r.p.product,r=>esc(`${r.p.product} ${r.p.version} ${r.p.extrainfo}`)||"-"],["CPE",r=>r.p.cpes[0]||"",r=>`<span class="mono">${esc(r.p.cpes[0]||"-")}</span>`],["Checks",r=>r.p.scripts.length,r=>esc(r.p.scripts.map(x=>x.id).join(", "))||"-"]],
fnd:[["Severity",r=>["Informational","Low","Medium","High","Critical"].indexOf(r.severity),r=>B(r.severity)],["Finding",r=>r.title,r=>`<b>${esc(r.title)}</b>`],["Target",r=>r.host,r=>`<span class="mono">${esc(r.host)}:${r.port}/${r.proto}</span>`],["Confidence",r=>r.confidence,r=>esc(r.confidence)],["Kind",r=>r.kind,r=>esc(r.kind)],["Status",r=>r._st,r=>esc(r._st)]],
cve:[["CVE",r=>r.id,r=>`<b class="mono">${esc(r.id)}</b>`],["Target",r=>r.host,r=>`<span class="mono">${esc(r.host)}:${r.port}</span>`],["CVSS",r=>r.cvss?.score??-1,r=>r.cvss?B(r.cvss.score,cvc(r.cvss.score)):"-"],["EPSS",r=>r.epss??-1,r=>r.epss==null?"-":(r.epss*100).toFixed(2)+"%"],["KEV",r=>+r.kev,r=>r.kev?B("KEV","Critical"):"-"],["Exploit refs",r=>r.exploit_refs.length,r=>r.exploit_refs.length||"-"],["Applicability",r=>r.applicability,r=>`${esc(r.applicability)} <span class="mu">(${esc(r.confidence)})</span>`],["Risk",r=>r.risk.score,r=>B(r.risk.severity)]],
enr:[["Target",r=>r.host,r=>`<span class="mono">${esc(r.host)}:${r.port}/${r.proto}</span>`],["Product",r=>r.product,r=>esc(`${r.product} ${r.version||""}`)],["Status",r=>r.status,r=>B(r.status,r.status=="ok"?"ok":r.status=="failed"?"failed":"partial")],["Attempts",r=>r.attempts.length,r=>r.attempts.map(a=>`${esc(a.strategy)}: ${esc(a.outcome)}${a.detail?` <span class="err">(${esc(a.detail)})</span>`:""}`).join("<br>")||"-"],["Note",r=>r.note||"",r=>esc(r.note||"")]]};
function draw(){const r=S.scan.result||{},t=S.tab;let rows=[];
if(t=="svc")rows=(r.hosts||[]).flatMap(h=>h.ports.map(p=>({h:h.address,hn:h.hostnames.join(","),p})));
if(t=="fnd")rows=(r.findings||[]).map(f=>({...f,_st:ST[`${f.host}|${f.port}/${f.proto}|${f.title}`]?.status||"Detected"}));
if(t=="cve")rows=r.cves||[];if(t=="enr")rows=r.enrichment?.services||[];
const tot=rows.length,q=S.q.toLowerCase();if(q)rows=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
if(S.sev)rows=rows.filter(x=>(x.severity||x.risk?.severity)==S.sev);if(S.kev)rows=rows.filter(x=>x.kev);
const sk=S.sort[t],cols=COLS[t];if(sk)rows=[...rows].sort((a,b)=>{const x=cols[sk.i][1](a),y=cols[sk.i][1](b);return(x>y?1:x<y?-1:0)*sk.d});else if(t=="fnd")rows=[...rows].sort((a,b)=>cols[0][1](b)-cols[0][1](a));
ROWS=rows;if($("#cnt"))$("#cnt").textContent=`${rows.length} of ${tot}`;
let empty=t=="cve"?"No CVE candidates. Check the Enrichment tab: an empty result is not proof the software is safe.":t=="fnd"?"No findings from the collected evidence (not proof of absence).":"Nothing to show.";
if(!r.hosts&&!["queued","running"].includes(S.scan.status))empty="No results (scan did not complete).";if(["queued","running"].includes(S.scan.status)&&!tot)empty="Scan in progress…";
$("#tbl").innerHTML=rows.length?`<div class="tbl"><table><thead><tr>${cols.map((c,i)=>`<th onclick="sortBy(${i})">${c[0]}${sk&&sk.i==i?(sk.d>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody>${rows.map((x,i)=>`<tr onclick="openDr(${i})">${cols.map(c=>`<td>${c[2](x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:`<div class="card empty">${empty}</div>`}
function sortBy(i){const c=S.sort[S.tab];S.sort[S.tab]={i,d:c&&c.i==i?-c.d:1};draw()}
function sec(h,b){return b?`<h4>${h}</h4>${b}`:""}
function openDr(i){const x=ROWS[i],t=S.tab;let h="",b="";
if(t=="cve"){h=`<div><b class="mono" style="font-size:16px">${esc(x.id)}</b><div>${B(x.risk.severity)} ${x.kev?B("CISA KEV","Critical"):""}</div></div>`;
b=sec("Match rationale",`<p>${esc(x.rationale)}</p><p><b>${esc(x.applicability)}</b> · confidence ${esc(x.confidence)} · strategy ${esc(x.strategy)}</p><p class="mu">Candidate only. Not confirmed on the target.</p>`)+sec("Description",`<p>${esc(x.description)}</p>`)+
sec("Scores",`<p>CVSS ${x.cvss?`${esc(x.cvss.score)} (${esc(x.cvss.severity)}, v${esc(x.cvss.version)})<br><span class="mono">${esc(x.cvss.vector)}</span>`:"n/a"}</p><p>EPSS ${x.epss==null?"n/a":(x.epss*100).toFixed(2)+"% (percentile "+(x.epss_pct*100).toFixed(1)+")"}</p><p>CISA KEV: ${x.kev?"listed":"not listed / not checked"}</p>`)+
sec("Risk reasoning (score "+x.risk.score+")",`<ul>${x.risk.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`)+sec("Exploit references (existence only; not verified or run)",x.exploit_refs.map(u=>`<p><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a></p>`).join("")||`<p class="mu">None tagged in NVD.</p>`)+
sec("References",x.references.map(u=>`<p><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a></p>`).join(""))+sec("Published / modified",`<p>${esc(x.published)} / ${esc(x.modified)}</p>`)+`<p><a href="https://nvd.nist.gov/vuln/detail/${esc(x.id)}" target="_blank" rel="noopener noreferrer">Open in NVD</a></p>`}
if(t=="fnd"){const k=`${x.host}|${x.port}/${x.proto}|${x.title}`,s=ST[k]||{};h=`<div><b style="font-size:16px">${esc(x.title)}</b><div>${B(x.severity)} <span class="mu">${esc(x.host)}:${x.port}/${x.proto} · confidence ${esc(x.confidence)}</span></div></div>`;
b=sec("Assessment",`<p>${esc(x.assessment)}</p>`)+sec("Why it matters",`<p>${esc(x.why)}</p>`)+sec("Applicability",`<p>${esc(x.applicability)}</p>`)+sec("Potential impact",`<p>${esc(x.impact)}</p>`)+sec("How to fix",`<p>${esc(x.fix)}</p>`)+sec("Safe next validation step",`<p>${esc(x.next_step)}</p>`)+sec("Evidence",`<pre>${esc(x.evidence)}</pre>`)+sec("References",x.refs.map(u=>`<p><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a></p>`).join(""))+
sec("Workflow",`<select id="ss" class="w">${STAT.map(o=>`<option ${(s.status||"Detected")==o?"selected":""}>${o}</option>`).join("")}</select><input id="so" class="w" style="margin-top:6px" placeholder="Owner" value="${esc(s.owner||"")}"><textarea id="sn" class="w" rows="3" style="margin-top:6px" placeholder="Analyst notes">${esc(s.notes||"")}</textarea><button class="btn" style="margin-top:8px" onclick="saveSt(${i})">Save</button>`)}
if(t=="svc"){const p=x.p;h=`<div><b style="font-size:16px">${esc(x.h)}:${p.port}/${p.proto}</b><div>${esc(p.state)} · ${esc(p.service)}</div></div>`;b=sec("Fingerprint",`<p>${esc(`${p.product} ${p.version} ${p.extrainfo}`)||"unidentified"}</p><p class="mu">method ${esc(p.method)} · conf ${esc(p.conf)} · reason ${esc(p.reason)}</p><p class="mono">${esc(p.cpes.join(", ")||"no CPE returned")}</p>`)+p.scripts.map(s=>sec("NSE: "+esc(s.id),`<pre>${esc(s.output)}</pre>`)).join("")}
if(t=="enr"){h=`<div><b>${esc(x.host)}:${x.port}/${x.proto}</b></div>`;b=sec("Result",`<p>${B(x.status,x.status=="ok"?"ok":x.status=="failed"?"failed":"partial")} ${esc(x.note||"")}</p>`)+sec("Attempts",`<pre>${esc(JSON.stringify(x.attempts,null,1))}</pre>`)}
$("#dr").innerHTML=`<header>${h}<button class="btn g" onclick="closeDr()">✕</button></header><div class="bd">${b}</div>`;$("#dr").classList.add("on");$("#ov").classList.add("on")}
function closeDr(){$("#dr").classList.remove("on");$("#ov").classList.remove("on")}
async function saveSt(i){const x=ROWS[i],k=`${x.host}|${x.port}/${x.proto}|${x.title}`;try{await api("/state",{method:"POST",body:{key:k,status:$("#ss").value,owner:$("#so").value,notes:$("#sn").value}});ST[k]={key:k,status:$("#ss").value};toast("Saved");draw()}catch(e){toast(e.message,1)}}
route();
</script></body></html>
